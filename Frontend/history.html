    <nav>
        <div>
            <h1><a href="#"><img src="images/myfitplan-logo.png" alt="logo" class="logo"></a></h1>
        </div>

        <ul>
            <li><a data-title="Dashboard" href="userSide.html">Dashboard</a></li>

    <div>

        <div class="header">
            <h1>Workout History</h1>
            <p>Workouts you have done</p>
        </div>

        <div class="group">

            <div class="workouthist">
                <div class="title">
                    <h2>Past Workouts</h2>
                </div>

                <select class="filterTime">
                    <option value="week">Current Week</option>
                    <option value="month">Current Month</option>
                    <option value="all-time">All Time</option>
                </select>

            </div>

            <div class="detailList">
                <div class="title">
                    <h2>Past Workouts</h2>
                </div>

                <div class="statsInfo">
                    <div class="info">
                        <p>Set Completed</p>
                        <h2>--/--</h2>
                    </div>

                    <div class="info">
                        <p>Weight</p>
                        <h2>--/--</h2>
                    </div>

                    <div class="info">
                        <p>Time</p>
                        <h2>--/--</h2>
                    </div>
                </div>

                <div>
                    <div class="workoutSpecificTitle">
                        <p>Exercise</p>
                        <p>Sets</p>
                        <p>Reps</p>
                        <p>Weight</p>
                    </div>

                    <div class="workoutSpecificData">
                        <p>--</p>
                        <p>--</p>
                        <p>--</p>
                        <p>--</p>
                    </div>
                </div>

            </div>


        </div>
    </div>
