<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="loginpage.css">
    <script defer src="hashPassword.js"></script>
    <script defer src="signup.js"></script>
</head>
<body class="login">

    <nav>
        <div>
            <h1><a href="#"><img src="images/myfitplan-logo.png" alt="logo" class="logo"></a></h1>
        </div>

        <ul>
            <li><a data-title="Home" href="index.html">Home</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2>Create Account</h2>
        <p class="form-hint">Use an email, a phone number, or both.</p>
        <form action="userSide.html" class="signupForm" novalidate>
            <div class="input-group">
                <label for="email" class="label">Email</label>
                <input type="email" id="email" class="input" placeholder="you@example.com">
                <span class="error-message"></span>
            </div>
            <br>
            <div class="input-group">
                <label for="phone" class="label">Phone</label>
                <input type="tel" id="phone" class="input" placeholder="+14085551234">
                <span class="error-message"></span>
            </div>
            <br>
            <div class="input-group">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" class="password">
                <span class="error-message"></span>
            </div>
            <br>
            <div class="input-group">
                <label for="confirm-password" class="label">Confirm Password</label>
                <input type="password" id="confirm-password" class="password">
                <span class="error-message"></span>
            </div>
            <br>
            <div class="checkbox-group">
                <input type="checkbox" id="sms-reminders">
                <label for="sms-reminders">Send me workout reminders by text</label>
            </div>
            <span class="error-message" id="form-error"></span>
            <br>
            <button class="button" type="submit">Create Account</button>
        </form>
        <p class="switch-form">Already have an account? <a href="loginpage.html">Log in</a></p>
    </div>
</body>
</html>
