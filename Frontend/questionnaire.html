
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Build My Plan | myfitplan</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>
    <nav class="navbar navbar-dark"
         style="background-color: #373733;">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <img src="images/myfitplan-logo.png"
                     alt="myfitplan"
                     height="30">
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <h1 class="text-center text-white mb-3">
                    Build Your Workout Plan
                </h1>

                <p class="text-center text-white mb-4">
                    Tell us about your fitness preferences
                </p>

                <form id="fitness-form">
                    <label for="fitness-goal" class="form-label text-white">
                    What is your fitness goal?
                    </label>
                    <div class="mb-3">
                        <select class="form-select" id="fitness-goal" name="goal" required>
                            <option value="" disabled selected>Select your goal</option>
                            <option value="weight_loss">Weight Loss</option>
                            <option value="muscle_gain">Muscle Gain</option>
                            <option value="endurance">Endurance</option>
                        </select>
                    </div>
                     
                    <div class="mb-3">
                    <label for="experience-level" class="form-label text-white">
                        What is your Experience Level?
                    </label>
                    <select class="form-select" id="experience-level" name="experience" required>
                        <option value="" disabled selected>Select your experience level</option>
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="workout-days" class="form-label text-white">
                            How many days per week would you like to work out?
                        </label>
                        <select class="form-select" id="workout-days" name="days" required>
                            <option value="" disabled selected>Select days per week</option>
                            <option value="3">3 days</option>
                            <option value="5">5 days</option>
                            <option value="7">7 days</option>
                        </select>
                   </div>

                    <div class="mb-3">
                    <label for="workout-duration" class="form-label text-white">
                        How long would you like each workout to be?
                    </label>
                    <select class="form-select" id="workout-duration" name="duration" required>
                        <option value="" disabled selected>Select workout duration</option>
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="45">45 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                    </div>

                   <button type="submit" class="btn btn-primary w-100">
                        Build My Plan
                     </button>

                    </form>

                        <option value="advanced">Advanced</option>
                    </select>
                    </div>

                 

                    </form>

            </div>
        </div>
    </main>
 <script src="questionnaire.js"></script>
</body>
</html>
