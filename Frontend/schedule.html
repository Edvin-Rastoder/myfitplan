<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="schedule.css">
    <script defer src="authenticate.js"></script>
    <script defer src="initialize.js"></script>
    <script defer src="schedule.js"></script>

</head>
<body>
    <nav>
        <div>
            <h1><a href="#"><img src="images/myfitplan-logo.png" alt="logo" class="logo"></a></h1>
        </div>

        <ul>
            <li><a data-title="Dashboard" href="userSide.html">Dashboard</a></li>
            <li><a data-title="Build Plan" href="questionnaire.html" >Build Plan</a></li>
            <li><a data-title="Schedule" href="schedule.html" >Schedule</a></li>
            <li><a data-title="Track Workout" href="trackworkout.html" >Track Workout</a></li>
            <li><a data-title="History" href="history.html" >History</a></li>
            <li><a data-title="Exercise Library" href="exerciseLibrary.html">Exercise Library</a></li>
            <li><a data-title="Logout" href="index.html" class="logout">Logout</a></li>
        </ul>
    </nav>

    <div>
        <div class="header">
            <h1>Schedule</h1>
            <p id="plan-dates"></p>
            <p id="schedule-status">Loading your schedule...</p>
        </div>
        
        <div class="schedule-settings">
            <h3>Choose Your Workout Days</h3>
            <p>Select the days you want to work out.</p>

            <div class="day-options">
                <label><input type="checkbox" value="1"> Mon</label>
                <label><input type="checkbox" value="2"> Tue</label>
                <label><input type="checkbox" value="3"> Wed</label>
                <label><input type="checkbox" value="4"> Thu</label>
                <label><input type="checkbox" value="5"> Fri</label>
                <label><input type="checkbox" value="6"> Sat</label>
                <label><input type="checkbox" value="7"> Sun</label>
            </div>

            <button id="save-schedule" type="button">Save Schedule</button>
            <p id="schedule-message"></p>
        </div>

        <!-- filled in by schedule.js with one card per date of the saved plan -->
        <div class="week" id="schedule-week"></div>
    </div>
</body>
</html>
